}

type JoysoundSong {
  id: ID!
  name: String!
  nameYomi: String!
  artistName: String!
  artistNameYomi: String!
  lyricsPreview: String
  tieUp: String
  # The YouTube video last queued with this song as its background MV (null
  # if it was last queued without one), so the song page can default to the
  # same video without another search. Persisted across app restarts.
  lastYoutubeVideoId: String
  # The sync-to-karaoke-track setting that accompanied that video.
  lastYoutubeVideoSyncEnabled: Boolean
}

# Chart categories both services publish (DAM calls ANIME "anison" and
# WESTERN "foreign"; the resolvers translate). VTUBER and DUET are DAM-only,
# because clubdam.com charts them but joysound.com has no equivalent page, so
# joysoundRanking rejects them; the remocon only offers them on the DAM page.
enum RankingCategory {
  OVERALL
  ANIME
  VOCALOID
  ENKA
  WESTERN
  VTUBER
  DUET
}

# Chart windows both services publish. Neither archives past months, so
# MONTHLY is the current rolling month.
enum RankingPeriod {
  WEEKLY
  MONTHLY
}

# One entry of a service's public Top 100 karaoke chart. `songId` is the
# service's catalog id (JOYSOUND selSongNo / DAM requestNo), so it plugs
# straight into the existing song pages and queue mutations. Null when the
# charted song isn't in the singable catalog (JOYSOUND's public chart lists
# songs sound-cafe.jp doesn't carry).
#
# Deliberately NOT named `id`: the same song charts in multiple categories,
# so a field literally called `id` would make Relay normalize every chart's
# entry for that song to one shared record, and its `rank` (which differs
# per chart) would get clobbered by whichever category query resolved last,
# scrambling the visible ranking. A non-`id` field keeps each chart's rows
# scoped to their own query.
type RankingSong {
  rank: Int!
  songId: ID
  name: String!
  nameYomi: String!
  artistName: String!
  artistNameYomi: String!
}

# One entry of a top-artist chart. `artistId` is the catalog artist id
# (JOYSOUND / DAM both expose one that maps straight to the artist pages);
# named `artistId` rather than `id` for the same Relay-normalization reason as
# RankingSong.songId.
type RankingArtist {
  rank: Int!
  artistId: ID
  name: String!
  nameYomi: String!
}

# One entry of Oricon's karaoke chart. Unlike RankingSong there is no id of
# any kind: Oricon is a third-party chart that spells titles and artists its
# own way, so a row only becomes singable once it's searched for on DAM or
# JOYSOUND. (Also keeps Relay from normalizing rows across charts. See the
# note on RankingSong.songId.)
type OriconChartSong {
  rank: Int!
  name: String!
  artistName: String!
}

# Oricon's current-week chart, plus the week it covers (YYYY-MM-DD). The week
# isn't chosen by the caller: the dateless chart URL redirects to the newest
# week, and this reports which one that turned out to be.
type OriconWeeklyChart {
  date: String!
  songs: [OriconChartSong!]!
}

# One option in JOYSOUND's monthly month-picker. `value` is a YYYYMM archive,
# or null for the current (latest) month; `label` is the site's button text
# (e.g. "6月").
type RankingMonth {
  value: String
  label: String!
}

type Emote {
  userIdentity: UserIdentity!
  emote: String!
}

type ServiceHealth {
  damAvailable: Boolean!
  joysoundAvailable: Boolean!
  checkedAt: String!
}

type UserIdentity {
  nickname: String!
  deviceId: String!
  # URL of the user's chosen profile picture (e.g. a PMDCollab portrait), or
  # null to fall back to the classic colored nickname badge.
  profilePictureUrl: String
  # Which PMD dialogue-portrait frame to draw around the picture: "male"
  # (blue) or "female" (pink). Null means male, matching older clients.
  profilePictureFrame: String
  # The singer this device is acting as. Null on pre-registry clients and on
  # queue items from before the registry existed; deviceId is the fallback.
  personId: String
}

# A singer. Attribution hangs off personId rather than deviceId so a cleared
# localStorage, a second device, or a handed-around phone still resolves to
# the same person. Devices attach to a person via claimPerson.
type Person {
  personId: String!
  displayName: String!
  profilePictureUrl: String
  profilePictureFrame: String
  lastSeenAt: Float!
}

input ScoreRecordInput {
  personId: String
  nickname: String!
  songType: String!
  songId: String!
  songName: String!
  artistName: String
  display: Float!
  band: String!
  overall: Float!
  pitch: Float!
  longTone: Float
  timing: Float
  compensationMs: Float!
}

type ScoreRecord {
  nickname: String!
  display: Float!
  band: String!
  timestamp: Float!
}

type ScoreHistory {
  # Highest this singer has scored on this song, and their most recent take.
  # Both null until they have one stored; they are the same record when the
  # latest take is also the best.
  best: ScoreRecord
  previous: ScoreRecord
  count: Int!
}

type GuideMelodyBackfill {
  songId: String!
  # Notes extracted. Zero is a real answer: some songs have no usable guide
  # melody channel, and that result is cached too so it isn't retried forever.
  noteCount: Int!
  # True when a melody was already cached and nothing was fetched.
  alreadyCached: Boolean!
}

type BreakMessage {
  text: String!
  # Nickname of whoever set the message, or null if unattributed.
  author: String
}

input UserIdentityInput {
  nickname: String!
  deviceId: String!
  profilePictureUrl: String
  profilePictureFrame: String
  personId: String
}

input CreatePersonInput {
  displayName: String!
  deviceId: String!
  profilePictureUrl: String
  profilePictureFrame: String
}

input EmoteInput {
  userIdentity: UserIdentityInput!
  emote: String!
}

input QueueDamSongInput {
  songId: String!
  name: String!
  artistName: String!
  playtime: Int
  streamingUrlIdx: Int!
  userIdentity: UserIdentityInput!
  # Semitone shift to start this song at, from a key suggestion. Null/absent
  # means 0, the previous behaviour.
  pitchShiftSemis: Int
}

input QueueJoysoundSongInput {
  songId: String!
  name: String!
  artistName: String!
  playtime: Int
  userIdentity: UserIdentityInput!
  isRomaji: Boolean!
  youtubeVideoId: String
  # Whether to time-align the attached YouTube video with the karaoke track
  # (waveform sync / end-together pad). Null means enabled.
  youtubeVideoSyncEnabled: Boolean
  # Semitone shift to start this song at, from a key suggestion. Null/absent
  # means 0, the previous behaviour.
  pitchShiftSemis: Int
}

input QueueYoutubeSongInput {
  songId: String!
  name: String!
  artistName: String!
  playtime: Int
  userIdentity: UserIdentityInput!
  adhocSongLyrics: String
  captionCode: String
  gainValue: Float!
  # Semitone shift to start this song at, from a key suggestion. Null/absent
  # means 0, the previous behaviour.
  pitchShiftSemis: Int
}

input QueueNicoSongInput {
  songId: String!
  name: String!
  artistName: String!
  playtime: Int
  userIdentity: UserIdentityInput!
  # Semitone shift to start this song at, from a key suggestion. Null/absent
  # means 0, the previous behaviour.
  pitchShiftSemis: Int
}

input QueueTuningTestInput {
  userIdentity: UserIdentityInput!
  # Which voice-height preset to centre the walk on ("lower" / "mixed" /
  # "higher"). Unknown or absent falls back to "mixed".
  presetId: String
  # Overrides, for a re-run after the first attempt ran out of room at one end.
  # Clamped to what the piano roll can actually display (+/-16 semitones from
  # the centre); an exercise whose extremes are off-canvas measures nothing
  # anybody can see.
  centreMidi: Int
  floorMidi: Int
  ceilingMidi: Int
}

# A singer's measured range. Every field is optional because an exercise nobody
# sang into produces no reading at all, and reporting that honestly beats
# reporting a range of zero.
type VocalRangeRecord {
  personId: String
  nickname: String!
  timestamp: Float!
  lowMidi: Int
  highMidi: Int
  comfortableLowMidi: Int
  comfortableHighMidi: Int
  # The singer reached the lowest/highest tone the exercise offered, so the
  # exercise ran out before their voice did. The card offers a re-run centred
  # further out rather than presenting this as their limit.
  hitFloor: Boolean!
  hitCeiling: Boolean!
  # Which estimator produced this. A record from an older version is not on the
  # same scale as a new one; keeping the version lets a caller notice.
  version: Int!
}

input VocalRangeInput {
  personId: String
  nickname: String!
  lowMidi: Int
  highMidi: Int
  comfortableLowMidi: Int
  comfortableHighMidi: Int
  hitFloor: Boolean!
  hitCeiling: Boolean!
  version: Int!
}

# Where a song sits, read off its reference melody.
#
# NOTE the absolute numbers are the raw reading and are NOT the octave anybody
# sings in: measured over 56 song/take pairs, an extracted JOYSOUND guide melody
# sits an octave above the singer on 33 and two octaves above on 20. Octave
# normalisation is a property of the singer, so it happens client-side against a
# measured range (see songOctaveShiftFor in common/vocalRange.ts), not here.
type SongVocalRange {
  lowMidi: Int!
  highMidi: Int!
  # Duration-weighted 5th/95th percentiles: where the song spends its time, as
  # opposed to the one grace note at each extreme. Percentiles rather than
  # min/max because JOYSOUND's guide synth displaces the odd note by an octave.
  tessituraLowMidi: Int!
  tessituraHighMidi: Int!
  noteCount: Int!
  # Whether this came from DAM's authored blob or our own extraction from
  # JOYSOUND's guide-melody channel. The authored one is the trustworthy
  # reading; the extraction is good but is a measurement, not a source.
  provenance: SongRangeProvenance!
}

enum SongRangeProvenance {
  DAM_AUTHORED
  JOYSOUND_EXTRACTED
}

# A song's range, or why we don't have one.
#
# UNAVAILABLE is a first-class, expected answer, not an error: a JOYSOUND song
# nobody has played has no extracted melody, and extracting one costs an ogg
# fetch plus an ffmpeg decode (~8s). That is fine once per song someone opens,
# and unacceptable per row of a search list, so list surfaces ask for cached
# ranges only. Callers show nothing at all when this is UNAVAILABLE. Absence
# of a suggestion is the same as having no opinion, which is the truth.
type SongVocalRangeResult {
  range: SongVocalRange
  availability: SongRangeAvailability!
  # How this song sits for the singer named in the query, or null when no
  # singer was named, they have no measured range, or we have no range for the
  # song. Null means "no opinion" and callers render nothing at all.
  fit: SongFit
}

input SongFitRef {
  source: SongSource!
  songId: String!
}

type SongFitEntry {
  source: SongSource!
  songId: String!
  fit: SongFit!
}

# A positive-only reading. There is deliberately no "too high" / "out of range"
# state: the app never tells anybody a song is wrong for them.
type SongFit {
  # True when the song already sits nicely, in the octave the singer would
  # naturally take it in. False simply means "no comment".
  comfortable: Boolean!
  # A semitone shift that would be easier on the voice, or null, which is the
  # common answer. Null when the song already fits, when no shift meaningfully
  # helps, or when the best shift still wouldn't land well. Never a nag.
  suggestedShiftSemis: Int
}

enum SongRangeAvailability {
  CACHED
  FETCHED
  UNAVAILABLE
}

type SongConnection {
  edges: [SongEdge!]!
  pageInfo: SongPageInfo!
}

# A karaoke channel on YouTube whose uploads all follow one title grammar, so
# their titles parse back into song/artist pairs. See main/karaokeChannels.ts
# for the registry and the per-channel parsers.
type KaraokeChannel {
  key: String!
  label: String!
  language: String!
}

# One playable karaoke render found on such a channel. Queued through the
# ordinary YouTube path, since these are YouTube videos, just ones we can read,
# so there is no KaraokeQueueItem; the parsed name/artist ride along to the
# queue so the history doesn't fill up with raw video titles.
type KaraokeChannelSong {
  # Channel-qualified, because Relay normalizes its store by type+id and the
  # same song found on two channels must stay two rows. Same reasoning as
  # SearchedSong's source-qualified id.
  id: ID!
  videoId: String!
  channelKey: String!
  channelLabel: String!
  name: String!
  artistName: String!
  # Which render this is when a channel publishes more than one of a song
  # ("no guide", "melody removed", "female key"). Null for a channel's plain
  # unmarked render.
  variant: String
  # The channel's own catalog number where the title carries one (KY.NNNNN).
  # Display only.
  catalogId: String
  playtime: Int
}

# Not a connection (no cursors): one page is all YouTube's channel search
# gives. `unavailableChannels` carries the labels of channels that didn't
# answer, so one rate-limited channel shows a notice instead of failing the
# whole search, the same bargain the merged DAM/JOYSOUND search makes.
type KaraokeChannelSongs {
  songs: [KaraokeChannelSong!]!
  unavailableChannels: [String!]!
}

type JoysoundSongConnection {
  edges: [JoysoundSongEdge!]!
  pageInfo: SongPageInfo!
}

type SongEdge {
  node: Song!
  cursor: String!
}

type JoysoundSongEdge {
  node: JoysoundSong!
  cursor: String!
}

type SongPageInfo {
  hasPreviousPage: Boolean!
  hasNextPage: Boolean!
  startCursor: String!
  endCursor: String!
}

# Which catalog a merged search row came from: what its badge says, and which
# detail route it opens (/song vs /joysoundSong).
enum SongSource {
  DAM
  JOYSOUND
}

# A row in a merged search. `id` is source-qualified ("DAM:1234") because
# Relay normalizes its store by type+id and the two catalogs hand out
# overlapping numeric ids. Same-id rows from the two services would otherwise
# collapse into one record and render as duplicates of whichever arrived last.
# `songId` is the raw service id the routes and mutations want.
type SearchedSong {
  id: ID!
  songId: String!
  source: SongSource!
  name: String!
  nameYomi: String!
  artistName: String!
  artistNameYomi: String!
}

type SearchedSongEdge {
  node: SearchedSong!
  cursor: String!
}

type SearchedSongConnection {
  edges: [SearchedSongEdge!]!
  pageInfo: SongPageInfo!
  # Catalogs that failed to answer this search. A blocked exit IP takes DAM
  # down routinely, and one dead service must degrade to a notice above the
  # other service's results rather than an empty page.
  unavailableSources: [SongSource!]!
}

type SearchedArtist {
  id: ID!
  artistId: String!
  source: SongSource!
  name: String!
  nameYomi: String!
  songCount: Int!
}

type SearchedArtistEdge {
  node: SearchedArtist!
  cursor: String!
}

type SearchedArtistConnection {
  edges: [SearchedArtistEdge!]!
  pageInfo: ArtistPageInfo!
  unavailableSources: [SongSource!]!
}

type StreamingUrlInfo {
  url: String!
}

input PushAdhocLyricsInput {
  lyric: String!
  lyricIndex: Int!
}

interface QueueItemInterface {
  songId: String!
  name: String!
  nameYomi: String!
  artistName: String!
  artistNameYomi: String!
  playtime: Int
  timestamp: String!
  userIdentity: UserIdentity!
  # Semitone shift to apply when this item starts playing, so a song queued
  # from a key suggestion arrives in the key it was queued for. Null (or
  # absent, on items queued by an older client or restored from an older
  # queue.json) means 0, which is exactly the previous behaviour: the renderer
  # used to reset the shift to 0 unconditionally at every pop.
  pitchShiftSemis: Int
}

type DamQueueItem implements QueueItemInterface {
  songId: String!
  name: String!
  nameYomi: String!
  artistName: String!
  artistNameYomi: String!
  streamingUrls: [StreamingUrlInfo!]
  scoringData: [Int!]
  playtime: Int
  timestamp: String!
  userIdentity: UserIdentity!
  pitchShiftSemis: Int
  streamingUrlIdx: Int!
}

type JoysoundQueueItem implements QueueItemInterface {
  songId: String!
  name: String!
  nameYomi: String!
  artistName: String!
  artistNameYomi: String!
  playtime: Int
  timestamp: String!
  userIdentity: UserIdentity!
  pitchShiftSemis: Int
  isRomaji: Boolean!
  youtubeVideoId: String
  scoringData: [Int!]
}

type YoutubeQueueItem implements QueueItemInterface {
  songId: String!
  name: String!
  nameYomi: String!
  artistName: String!
  artistNameYomi: String!
  playtime: Int
  timestamp: String!
  userIdentity: UserIdentity!
  pitchShiftSemis: Int
  hasAdhocLyrics: Boolean!
  hasCaptions: Boolean!
  gainValue: Float!
}

type NicoQueueItem implements QueueItemInterface {
  songId: String!
  name: String!
  nameYomi: String!
  artistName: String!
  artistNameYomi: String!
  playtime: Int
  timestamp: String!
  userIdentity: UserIdentity!
  pitchShiftSemis: Int
}

# A guided warm-up exercise, queued and played like a song so it needs no
# special handling anywhere in the queue. Carries its own generated reference
# melody (sustained tones walking outward from a centre) rather than fetching
# anything, and plays against a silent generated video that exists only to give
# the renderer a media clock. Everything downstream of Player keys off
# <video>.currentTime, and the queue only advances on its media events.
type TuningQueueItem implements QueueItemInterface {
  songId: String!
  name: String!
  nameYomi: String!
  artistName: String!
  artistNameYomi: String!
  playtime: Int
  timestamp: String!
  userIdentity: UserIdentity!
  pitchShiftSemis: Int
  # The exercise, in the same binary layout as DAM's scoring reference data, so
  # the piano roll and the guide-melody synth consume it unchanged.
  #
  # Nullable purely to match DamQueueItem/JoysoundQueueItem: Relay rejects a
  # union whose members give the same field name different nullability, since
  # every member is selected into one response shape. It is never actually null
  # here, since the exercise is generated at queue time and cannot fail to
  # exist.
  scoringData: [Int!]
  # The parameters it was generated from, so the renderer can rebuild the exact
  # target list to measure against without re-deriving it from the blob.
  centreMidi: Int!
  floorMidi: Int!
  ceilingMidi: Int!
  durationSecs: Float!
}

union QueueItem =
  | DamQueueItem
  | JoysoundQueueItem
  | YoutubeQueueItem
  | NicoQueueItem
  | TuningQueueItem

