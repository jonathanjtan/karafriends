  profilePictureFrame: String
  # The singer this device is acting as. Null on pre-registry clients and on
  # queue items from before the registry existed; deviceId is the fallback.
  personId: String
}

# A singer. Attribution hangs off personId rather than deviceId so a cleared
# localStorage, a second device, or a handed-around phone still resolves to
# the same person. Devices attach to a person via claimPerson.
type Person {
  personId: String!
  displayName: String!
  profilePictureUrl: String
  profilePictureFrame: String
  lastSeenAt: Float!
}

