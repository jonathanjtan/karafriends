}

interface VideoInfo {
  author: String!
  channelId: String!
  lengthSeconds: Int!
  description: String!
  title: String!
  viewCount: Int!
}

type YoutubeVideoInfo implements VideoInfo {
  author: String!
  captionLanguages: [CaptionLanguage!]!
  channelId: String!
  keywords: [String!]
  lengthSeconds: Int!
  description: String!
  title: String!
  viewCount: Int!
  gainValue: Float!
  # False when YouTube's metadata region-locks the video out of the US —
  # an embedded preview on a non-VPN phone would show "Video unavailable"
  # (the download still works; it runs on the VPN'd host). Null = unknown.
  availableInUs: Boolean
  # Whether the uploader allows embedding at all; false also breaks previews.
  embeddable: Boolean!
}

