type Query {
  adhocLyrics(id: String!): [String!]
  artistById(id: String, first: Int, after: String): Artist!
  artistsByName(name: String, first: Int, after: String): ArtistConnection!
  config: KarafriendsConfig!
  currentSong: QueueItem
  joysoundArtistsByKeyword(
    keyword: String
    first: Int
    after: String
  ): JoysoundArtistConnection!
  # The song's full lyrics, one entry per displayed line, read out of the
  # telop blob. sound-cafe's song detail page only carries a single truncated
  # opening line (JoysoundSong.lyricsPreview), so this is the only way to show
  # more. It is deliberately a separate query rather than a JoysoundSong
  # field: on a cache miss it costs the same getFME call queueing the song
  # makes, so the song page asks for it only when someone opts in.
  joysoundLyrics(songId: String!): JoysoundLyricsResult!
  joysoundSongDetail(id: String): JoysoundSong!
  joysoundSongsByArtist(
    artistId: String
    first: Int
    after: String
  ): JoysoundSongConnection!
  joysoundSongsByKeyword(
    keyword: String
    first: Int
    after: String
  ): JoysoundSongConnection!
  # Filename of the bundled BGM track to play between songs, the shuffle
  # sentinel, or null for no BGM.
  bgmTrack: String
  bgmVolume: Float!
  # Epoch milliseconds when the current break ends, or null when not on
  # break. While set (and in the future), the renderer holds on the
  # intermission screen instead of starting the next song.
  breakEndsAt: Float
  # Custom message shown on the intermission screen while a break is active,
  # or null for none. Set via the remocon's "Edit Break Message" button.
  breakMessage: BreakMessage
  guideMelodyVolume: Float!
  # Whether mic audio is played through the app's own speakers (the dry
  # signal plus its reverb/echo). Turning it off mutes the mics locally so the
  # room can be mixed through external hardware instead; pitch tracking is
  # unaffected either way, so scoring and the piano roll keep working.
  micOutputEnabled: Boolean!
  # Whether quiet mic signal is ignored for pitch tracking (an absolute RMS
  # floor). For setups where an external mixer's FX return (echo/reverb of
  # every mic) bleeds into the per-mic channels: the bleed is quiet but
  # periodic, so without the gate an idle mic ghost-draws the active singer's
  # melody on the piano roll. Off by default (the historical behavior).
  micRmsGateEnabled: Boolean!
  # The RMS floor the Pitch Gate applies, linear full-scale (0.02 ~= -34
  # dBFS). Tunable rather than fixed because how far the FX-return bleed sits
  # below the dry signal depends on the mixer's gain staging and FX send.
  micRmsGateThreshold: Float!
  # EXPERIMENTAL: whether sung performances are scored against the guide
  # melody and a card is shown when a song ends. Off by default. The formula
  # is still being tuned and its numbers match no commercial machine; only
  # DAM and JOYSOUND songs carry the reference melody it needs.
  experimentalScoringEnabled: Boolean!
  # Whether a played song is recorded to songHistory. Defaults on in a
  # packaged build and off under `run-dev`, and is re-derived every launch
  # rather than restored, because testing the app means queueing songs nobody
  # sang and those must not reach the history, the play counts, or anything
  # else keyed off it.
  historyRecordingEnabled: Boolean!
  # The "host:port" a phone should use to reach the remocon, which is what the
  # QR codes encode. Synced rather than renderer-local so every window that
  # draws a QR (the sidebar, the intermission screen, the popped-out QR window)
  # agrees without a relay. Defaults to a private LAN IPv4 of this machine.
  hostname: String!
  nicoVideoInfo(videoId: String): NicoVideoInfoResult!
  # Whether the big screen uses the dark OLED-friendly theme. Synced so the
  # remocon can toggle it on the TV remotely.
  oledFriendly: Boolean!
  pianoRollOpacity: Float!
  pianoRollSize: Float!
  pitchShiftSemis: Int!
  playbackState: PlaybackState!
  queue: [QueueItem!]!
  # Whether the big screen cuts to a fullscreen queue screen for a few seconds
  # between songs (like a real DAM/JOYSOUND machine) before starting the next
  # song. Synced so the remocon can toggle it.
  queueIntermissionEnabled: Boolean!
  serviceHealth: ServiceHealth!
  # Whether the big-screen (renderer) Settings section is collapsed. Synced so
  # the remocon can hide/show it on the TV remotely.
  settingsCollapsed: Boolean!
  # Whether the big-screen (renderer) sidebar (QR + Settings + Queue) is hidden
  # so the playing song can go fullscreen. Synced so the remocon can toggle it
  # on the TV remotely.
  sidebarCollapsed: Boolean!
  songById(id: String!): Song!
  songsByName(name: String, first: Int, after: String): SongConnection!
  # Both catalogs in one list, ranked together by how well each title matches
  # the keyword. The per-service `songsByName`/`joysoundSongsByKeyword` above
  # still back the Oricon lookup and anything that wants one catalog only.
  searchSongs(
    keyword: String
    first: Int
    after: String
  ): SearchedSongConnection!
  searchArtists(
    keyword: String
    first: Int
    after: String
  ): SearchedArtistConnection!
  # The karaoke YouTube channels karafriends knows how to read, for the filter
  # chips. Static data. It describes what `karaokeChannelSongs` will search.
  karaokeChannels: [KaraokeChannel!]!
  # One search across those channels. Deliberately not a connection: YouTube's
  # channel search answers with a single padded page and gives no offset to
  # resume from, so there is no second page to hand out. See
  # KaraokeChannelSongs.
  karaokeChannelSongs(
    keyword: String
    channels: [String!]
  ): KaraokeChannelSongs!
  # JOYSOUND's public Top 100 karaoke charts (joysound.com), with ids mapped
  # back to the catalog so entries open like search results. `month` (YYYYMM)
  # selects a past monthly archive; null uses the current chart.
  joysoundRanking(
    category: RankingCategory!
    period: RankingPeriod!
    month: String
  ): [RankingSong!]!
  # DAM's public Top 100 karaoke charts (clubdam.com), same deal. DAM keeps no
  # past-month archives, so there is no month argument.
  damRanking(
    category: RankingCategory!
    period: RankingPeriod!
  ): [RankingSong!]!
  # Top-artist charts; entries link to the services' artist pages.
  joysoundArtistRanking(
    period: RankingPeriod!
    month: String
  ): [RankingArtist!]!
  damArtistRanking(period: RankingPeriod!): [RankingArtist!]!
  # Months JOYSOUND offers for its monthly charts (current + ~5 archives),
  # newest first, for the remocon's month picker.
  joysoundRankingMonths: [RankingMonth!]!
  # Oricon's current-week karaoke Top 20 (oricon.co.jp), which the site splits
  # over two pages. Past years are paywalled, never change, and are only ever a
  # Top 10, so those ship as a static table in common/oriconChart.ts. The live
  # week is the only part that needs fetching.
  oriconWeeklyRanking: OriconWeeklyChart!
  # Everyone in the registry, most recently seen first. Drives the identity
  # gate's picker and the switch-account sheet.
  people: [Person!]!
  # The singer this device last claimed, or null if the device is unclaimed,
  # which is what puts the remocon behind the identity gate.
  personByDevice(deviceId: String!): Person
  # Whether JOYSOUND romaji lyrics are segmented at word boundaries (kuromoji
  # tokenization, e.g. あるもの -> "aru mono") instead of only at script-class
  # boundaries (e.g. "arumono"). Synced so it can be A/B toggled live from the
  # remocon or renderer sidebar without restarting or re-downloading the song.
  joysoundRomajiWordSegmentation: Boolean!
  songHistory(first: Int, after: String): SongHistoryConnection!
  # How many times this singer has already sung this song, counted over
  # songHistory and including the play in progress. Zero only when history
  # recording is off, so callers should read 0 and 1 the same way ("first
  # time"). Matched on personId when both sides have one, otherwise nickname,
  # since entries from before the singer registry carry no personId.
  # This singer's stored scores for one song, newest formula only. A record
  # from an older formula was produced on a different scale and would make a
  # personal best nobody can beat. Empty until a take has been scored and
  # recorded, which only happens while history recording is on.
  scoreHistory(
    songType: String!
    songId: String!
    nickname: String!
    personId: String
  ): ScoreHistory!
  songPlayCount(
    songType: String!
    songId: String!
    nickname: String!
    personId: String
  ): Int!
  # This singer's most recent measured range, or null if they haven't done the
  # warm-up. Matched on personId when both sides have one, otherwise nickname.
  vocalRange(nickname: String!, personId: String): VocalRangeRecord
  # Where a song sits. `allowFetch: false` (the default) answers only from the
  # local cache and never touches the network. That is the mode list surfaces
  # use, where an 8s extraction per row is out of the question. A song detail
  # page, opening one song the user actually tapped, may pass true.
  # How a batch of songs sits for one singer, answered **from the local cache
  # only**. This is the list-surface counterpart of songVocalRange, and it
  # never fetches or extracts anything. Songs with no cached range are simply
  # absent from the result, which callers render as no marker at all.
  #
  # One request per page of results rather than one per row: a search page is
  # ~60 rows, and a marker is not worth 60 round trips.
  songFits(
    songs: [SongFitRef!]!
    nickname: String!
    personId: String
  ): [SongFitEntry!]!
  # Passing nickname/personId also computes `fit` for that singer. The fit is
  # decided here rather than on the phone because it needs the song's
  # duration-weighted pitch distribution, which is far more data than the
  # answer is worth shipping.
  songVocalRange(
    source: SongSource!
    songId: String!
    allowFetch: Boolean
    nickname: String
    personId: String
  ): SongVocalRangeResult!
  suggestedYoutubeVideos(songId: String!): SuggestedYoutubeVideosResult!
  videoDownloadProgress(
    videoDownloadType: Int!
    songId: String!
    suffix: String
  ): VideoDownloadProgress!
  youtubeVideoInfo(videoId: String): YoutubeVideoInfoResult!
}

type Mutation {
  # Maybe we can merge these queue endpoints once Input Unions become real
  # https://github.com/graphql/graphql-spec/issues/488
  sendEmote(emote: EmoteInput!): Boolean!
  popSong: QueueItem
  pushAdhocLyrics(input: PushAdhocLyricsInput): Boolean!
  queueDamSong(
    input: QueueDamSongInput
    tryHeadOfQueue: Boolean!
  ): QueueSongResult!
  queueJoysoundSong(
    input: QueueJoysoundSongInput
    tryHeadOfQueue: Boolean!
  ): QueueSongResult!
  queueYoutubeSong(
    input: QueueYoutubeSongInput
    tryHeadOfQueue: Boolean!
  ): QueueSongResult!
  queueNicoSong(
    input: QueueNicoSongInput
    tryHeadOfQueue: Boolean!
  ): QueueSongResult!
  # Queue the guided warm-up. Generates its own reference melody and silent
  # video, so unlike every other queue mutation it reaches no service at all.
  queueTuningTest(
    input: QueueTuningTestInput
    tryHeadOfQueue: Boolean!
  ): QueueSongResult!
  recheckServiceHealth: ServiceHealth!
  removeSong(songId: String!, timestamp: String!): Boolean!
  # Rewrite the identity (nickname/avatar) on everything this device has in
  # the queue, matched by deviceId, so profile edits show up on already-queued
  # songs. Returns true if anything changed. Also writes the edit through to
  # the person this device is attached to, which is what makes a rename stick
  # across devices and relaunches.
  updateUserIdentity(identity: UserIdentityInput!): Boolean!
  # Register a new singer and attach this device to them.
  createPerson(input: CreatePersonInput!): Person!
  # Attach this device to an existing singer: the "that's me" tap on the
  # identity gate, and the switch-account sheet.
  claimPerson(personId: String!, deviceId: String!): Person!
  # Remove a singer from the registry (admin cleanup for duplicates and
  # one-time guests). Their devices fall back to the identity gate; song
  # history keeps the name/avatar snapshot it already recorded.
  deletePerson(personId: String!): Boolean!
  moveSong(songId: String!, timestamp: String!, offset: Int!): Boolean!
  clearQueue: Boolean!
  setBgmTrack(track: String): Boolean!
  setBgmVolume(volume: Float!): Boolean!
  # Start a break ending at the given epoch ms, or pass null to end it.
  setBreakEndsAt(endsAt: Float): Boolean!
  setBreakMessage(text: String, author: String): Boolean!
  setGuideMelodyVolume(volume: Float!): Boolean!
  setMicOutputEnabled(enabled: Boolean!): Boolean!
  setMicRmsGateEnabled(enabled: Boolean!): Boolean!
  setMicRmsGateThreshold(threshold: Float!): Boolean!
  setExperimentalScoringEnabled(enabled: Boolean!): Boolean!
  setHistoryRecordingEnabled(enabled: Boolean!): Boolean!
  # Fetch a JOYSOUND song's audio and extract its guide melody into the cache,
  # without downloading a video or queueing anything. Exists so a lost melody
  # cache can be rebuilt from a list of songIds. The sung performances in
  # probe-logs/ are useless for offline scoring work without the melody they
  # were sung against. See scripts/backfillMelodies.mjs.
  backfillGuideMelody(songId: String!): GuideMelodyBackfill!
  # Persist a scored performance. Called by the renderer when it reveals a card.
  # Ignored while history recording is off, so test queueing can't invent a
  # personal best. Returns whether it was stored.
  recordScore(input: ScoreRecordInput!): Boolean!
  # Persist a measured vocal range. Called by the renderer when the warm-up
  # ends. Gated on history recording exactly like recordScore, so a range
  # measured while testing the app doesn't stick to anybody.
  recordVocalRange(input: VocalRangeInput!): Boolean!
  setHostname(hostname: String!): Boolean!
  setOledFriendly(oledFriendly: Boolean!): Boolean!
  setPianoRollOpacity(opacity: Float!): Boolean!
  setPianoRollSize(size: Float!): Boolean!
  setPitchShiftSemis(semis: Int!): Boolean!
  setJoysoundRomajiWordSegmentation(enabled: Boolean!): Boolean!
  setPlaybackState(playbackState: PlaybackState!): Boolean!
  setQueueIntermissionEnabled(enabled: Boolean!): Boolean!
  setSettingsCollapsed(collapsed: Boolean!): Boolean!
  setSidebarCollapsed(collapsed: Boolean!): Boolean!
}

type Subscription {
  bgmTrackChanged: String
  bgmVolumeChanged: Float!
  breakEndsAtChanged: Float
  breakMessageChanged: BreakMessage
  currentSongAdhocLyricsChanged: [AdhocLyricsEntry!]!
  currentSongChanged: QueueItem
  emote: Emote!
  guideMelodyVolumeChanged: Float!
  joysoundRomajiWordSegmentationChanged: Boolean!
  micOutputEnabledChanged: Boolean!
  micRmsGateEnabledChanged: Boolean!
  micRmsGateThresholdChanged: Float!
  experimentalScoringEnabledChanged: Boolean!
  historyRecordingEnabledChanged: Boolean!
  hostnameChanged: String!
  oledFriendlyChanged: Boolean!
  pianoRollOpacityChanged: Float!
  pianoRollSizeChanged: Float!
  pitchShiftSemisChanged: Int!
  playbackStateChanged: PlaybackState!
  queueIntermissionEnabledChanged: Boolean!
  settingsCollapsedChanged: Boolean!
  sidebarCollapsedChanged: Boolean!
  queueAdded: QueueItem!
  queueChanged: SubscriptionQueueChanged!
  # Fires whenever the registry changes, so an open identity gate on one phone
  # picks up someone joining on another without a reload.
  peopleChanged: [Person!]!
}

